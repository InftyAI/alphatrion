[project]
name = "alphatrion"
version = "0.3.1"
description = "⚒️ AlphaTrion is building open-source self-improving AI systems, with a reusable framework for LLM experiment tracking and agent orchestration."
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "oras (>=0.2.38,<0.3.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "traceloop-sdk (>=0.47.5,<1.0.0)",
    "openai (>=2.6.1,<3.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "pg8000>=1.31.5",
    "uvicorn>=0.38.0",
    "strawberry-graphql>=0.285.0",
    "fastapi>=0.121.2",
    "rich>=14.2.0",
    "httpx>=0.28.1",
    "clickhouse-connect>=0.7.0",
    "faker>=37.12",
    "prometheus-client>=0.21.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The base install is the framework, so `framework` adds nothing on top of it.
# It exists so users can state their intent: `pip install alphatrion[framework]`.
framework = []
# Dependencies of `alphatrion.swarm`, the self-improvement system: tracing,
# with OpenTelemetry and OpenInference's conventions and instrumentors.
swarm = [
    "opentelemetry-sdk>=1.38.0",
    "openinference-semantic-conventions>=0.1.43",
    "openinference-instrumentation-openai>=0.1.69",
]
s3 = [
    "boto3>=1.35.0",
]
# Claude models in the model router. OpenAI-compatible models work without it.
anthropic = [
    "anthropic>=1.8.0",
    "openinference-instrumentation-anthropic>=3.3.0",
]
all = [
    "alphatrion[framework,swarm,s3,anthropic]",
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]
lint = [
    "import-linter>=2.15",
    "ruff>=0.12",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=0.22",
    "pytest-timeout>=2.1",
    "nest-asyncio>=1.5.0",  # Required for DataLoader tests
    "moto>=5.0.0",  # For S3 backend testing
    "boto3>=1.35.0",  # Required by moto for S3 mocking
]

[project.scripts]
alphatrion = "alphatrion.framework.server.cmd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphatrion"]
# Ship only the library: leave out tests, dev scripts, docs, and deployment files.
exclude = [
    "alphatrion/*/tests",
    "alphatrion/framework/hack",
    "alphatrion/framework/docs",
    "alphatrion/swarm/docs",
    "alphatrion/framework/dashboard",
    "alphatrion/framework/config/grafana",
    "alphatrion/framework/config/prometheus",
    "alphatrion/framework/Dockerfile",
    "alphatrion/framework/docker-compose*.yaml",
    "alphatrion/framework/.env.*",
]

[tool.hatch.build.targets.sdist]
# The library doesn't need the dashboard or the README images to build.
exclude = [
    "alphatrion/framework/dashboard",
    "**/node_modules",
    "site",
]

# Configuration for ruff linter and formatter

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = [
    "E",  # pycodestyle,
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "PL",  # PyLint,
]
lint.ignore = [
    "E501",  # Line too long
    "PLR0913",  # Too many arguments in function definition
    "PLR0912",  # Too many branches
    "PLR0911",  # Too many return statements
    "SIM117", # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "PLR0915", # Too many statements in function
    "PLC0415", # `import` should be at the top-level of a file
    "PLW0603", # Using the global statement
]
exclude = [
    "venv",
    "alphatrion/framework/migrations",
    "__pycache__",
    # Code the cases vendor from upstream projects, kept unchanged so their
    # results stay comparable.
    "examples/cases/*/upstream",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"alphatrion/*/tests/*" = ["PLR2004", "B017"]

# Keep the framework reusable on its own: it must never depend on swarm.

[tool.importlinter]
root_package = "alphatrion"

[[tool.importlinter.contracts]]
name = "framework does not import swarm"
type = "forbidden"
source_modules = ["alphatrion.framework"]
forbidden_modules = ["alphatrion.swarm"]
